# XcodeGen 설정. Jamkkan.xcodeproj가 열리지 않을 때 `xcodegen generate`로 다시 만들 수 있고,
# GitHub Actions 빌드도 이 파일로 프로젝트를 생성한다.
name: Jamkkan
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jamkkan:
    type: application
    platform: iOS
    sources:
      - path: Jamkkan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jamkkan.fakecall
        INFOPLIST_FILE: Jamkkan/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  Jamkkan:
    build:
      targets:
        Jamkkan: all
    run:
      config: Debug
    archive:
      config: Release
